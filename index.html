<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1.0" />
	<title>KiOnline</title>
	<link rel="stylesheet" href="/styles.css" />
</head>
<body>
	<div class="screen" id="screen-home"></div>
	<div class="screen hidden" id="screen-project"></div>
	<div class="screen hidden" id="screen-editor">
	<header class="top">
		<div class="top-title-row">
			<button type="button" class="brand" id="brand-home-btn" title="Back to Project overview">
				<svg class="brand-mark" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 5 H15 L20 10 V19 H4 Z M15 5 V10 H20"/><path d="M8 14 H16 M12 10 V18"/></svg>
				<span>KiOnline</span><span class="app-version" id="app-version" title="Build info"></span>
			</button>
			<nav class="menu-bar" id="main-menu-bar" aria-label="Application menu">
				<div class="menu-group"><button type="button" class="menu-trigger" aria-expanded="false">File</button><div class="menu-popover">
					<button type="button" class="menu-command" data-action-target="btn-new-project">New Project</button>
					<button type="button" class="menu-command" data-input-target="file-input">Open…<span>Ctrl+O</span></button>
					<button type="button" class="menu-command" data-action-target="btn-open-project">Open Project Folder…</button>
					<button type="button" class="menu-command" data-input-target="zip-input">Open Project Archive…</button>
					<div class="menu-divider"></div>
					<button type="button" class="menu-command" data-action-target="btn-save-project">Save Project<span>Ctrl+S</span></button>
					<button type="button" class="menu-command" data-action-target="btn-export-edit">Export Schematic…</button>
				</div></div>
				<div class="menu-group"><button type="button" class="menu-trigger" aria-expanded="false">Edit</button><div class="menu-popover">
					<button type="button" class="menu-command" data-action-target="btn-undo">Undo<span>Ctrl+Z</span></button>
					<button type="button" class="menu-command" data-action-target="btn-redo">Redo<span>Ctrl+Shift+Z</span></button>
					<div class="menu-divider"></div>
					<button type="button" class="menu-command" data-shortcut="cut">Cut<span>Ctrl+X</span></button>
					<button type="button" class="menu-command" data-shortcut="copy">Copy<span>Ctrl+C</span></button>
					<button type="button" class="menu-command" data-shortcut="paste">Paste<span>Ctrl+V</span></button>
					<button type="button" class="menu-command" data-shortcut="duplicate">Duplicate<span>Ctrl+D</span></button>
				</div></div>
				<div class="menu-group"><button type="button" class="menu-trigger" aria-expanded="false">View</button><div class="menu-popover">
					<button type="button" class="menu-command" data-action-target="view-tab-schematic">Schematic Editor</button>
					<button type="button" class="menu-command" data-action-target="view-tab-board">PCB Editor</button>
					<div class="menu-divider"></div>
					<button type="button" class="menu-command" data-shortcut="zoom-fit">Zoom to Fit<span>Home</span></button>
				</div></div>
				<div class="menu-group"><button type="button" class="menu-trigger" aria-expanded="false">Place</button><div class="menu-popover">
					<button type="button" class="menu-command" data-tool="place-symbol">Symbol<span>A</span></button>
					<button type="button" class="menu-command" data-tool="power">Power Port</button>
					<button type="button" class="menu-command" data-tool="wire">Wire<span>W</span></button>
					<button type="button" class="menu-command" data-tool="label">Net Label</button>
					<button type="button" class="menu-command" data-tool="text">Text</button>
				</div></div>
				<div class="menu-group"><button type="button" class="menu-trigger" aria-expanded="false">Inspect</button><div class="menu-popover">
					<button type="button" class="menu-command" data-action-target="btn-highlight-net">Highlight Net</button>
				</div></div>
				<div class="menu-group"><button type="button" class="menu-trigger" aria-expanded="false">Tools</button><div class="menu-popover">
					<button type="button" class="menu-command" data-action-target="btn-index-symbols">Manage Symbol Libraries…</button>
				</div></div>
			</nav>
			<nav class="breadcrumb hidden" id="editor-breadcrumb">
				<span class="breadcrumb-project" id="breadcrumb-project"></span>
				<span class="breadcrumb-sep" aria-hidden="true">/</span>
				<span class="breadcrumb-sheet" id="breadcrumb-sheet"></span>
			</nav>
			<nav class="view-tabs hidden" id="view-tabs">
				<button type="button" class="view-tab" id="view-tab-schematic" data-view="schematic">Schematic</button>
				<button type="button" class="view-tab" id="view-tab-board" data-view="board">PCB</button>
			</nav>
		</div>
		<div class="command-toolbar" role="toolbar" aria-label="Main toolbar">
			<div class="toolbar-section" id="view-actions">
				<button type="button" class="toolbar-button" id="btn-new-project" title="New Project"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 5 H14 L19 10 V20 H4 Z M14 5 V10 H19 M12 12 V18 M9 15 H15"/></svg></button>
				<button type="button" class="toolbar-button" data-input-target="file-input" title="Open Schematic or PCB"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 8 H10 L12 10 H21 V19 H3 Z"/><path d="M3 8 V5 H10 L12 7 H18"/></svg></button>
				<button type="button" class="toolbar-button" id="btn-open-project" title="Open Project Folder"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 8 H10 L12 10 H21 V19 H3 Z"/><path d="M12 12 V17 M9.5 14.5 L12 12 L14.5 14.5"/></svg></button>
				<button type="button" class="toolbar-button" data-input-target="zip-input" title="Open Project Archive"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 8 H10 L12 10 H21 V19 H3 Z"/><path d="M12 11 V17 M9 14 L12 17 L15 14"/></svg></button>
				<button type="button" class="toolbar-button" id="btn-save-project" title="Save Project" disabled><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 4 H17 L20 7 V20 H5 Z M8 4 V10 H16 V4 M8 20 V14 H17 V20"/></svg></button>
			</div>
			<div class="toolbar-divider" aria-hidden="true"></div>
			<nav class="toolbar-section toolbar-view-switcher" aria-label="Editor views">
				<button type="button" class="toolbar-button" data-action-target="view-tab-schematic" title="Schematic Editor"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="6" y="7" width="12" height="10"/><path d="M3 10 H6 M3 14 H6 M18 10 H21 M18 14 H21 M10 7 V4 M14 7 V4 M10 17 V20 M14 17 V20"/></svg></button>
				<button type="button" class="toolbar-button" data-action-target="view-tab-board" title="PCB Editor"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 5 H19 V19 H5 Z M8 8 H12 V12 H8 Z M14 12 H17 V16 H14 Z"/><path d="M12 10 H16 M10 12 V16"/></svg></button>
			</nav>
			<div class="toolbar-divider" aria-hidden="true"></div>
			<div class="toolbar-section hidden" id="edit-actions">
				<button type="button" class="toolbar-button" id="btn-index-symbols" title="Manage Symbol Libraries"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 5 H15 L20 10 V19 H4 Z M15 5 V10 H20"/><path d="M8 14 H16 M12 11 V17"/></svg></button>
				<button type="button" class="toolbar-button" id="btn-export-edit" title="Export Schematic"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 4 H17 L20 7 V20 H5 Z M17 4 V8 H20"/><path d="M12 10 V17 M9 14 L12 17 L15 14"/></svg></button>
			</div>
			<input type="file" id="file-input" accept=".kicad_sch,.kicad_pcb,.kicad_pro" hidden />
			<input type="file" id="zip-input" accept=".zip" hidden />
			<input type="file" id="symbol-directory-input" webkitdirectory directory multiple hidden />
		</div>
		<!-- Circuit Layout (auto-place/auto-wire demo) is parked, not deleted —
			no button reaches setMode('circuit') anymore, so this stays
			permanently hidden until it comes back as a project-overview tile
			rather than a competing top-level mode. -->
		<div class="actions hidden" id="circuit-actions">
			<label class="file-btn">
				Open .kicad_sch
				<input type="file" id="circuit-file-input" accept=".kicad_sch" hidden />
			</label>
			<button type="button" id="btn-demo">Load demo</button>
			<label class="file-btn">
				Recipe JSON
				<input type="file" id="recipe-input" accept=".json,application/json" hidden />
			</label>
			<label class="file-btn">
				IC .kicad_sym
				<input type="file" id="symbol-input" accept=".kicad_sym,.kicad_sch" hidden />
			</label>
			<button type="button" id="btn-place">Place</button>
			<button type="button" id="btn-autowire">Auto wire</button>
			<button type="button" id="btn-clear-wires">Clear wires</button>
			<button type="button" id="btn-export">Export .kicad_sch</button>
		</div>
		<button type="button" id="mode-view" hidden></button>
		<button type="button" id="mode-circuit" hidden></button>
		<button type="button" id="mode-edit" hidden></button>
		<button type="button" id="btn-undo" hidden></button>
		<button type="button" id="btn-redo" hidden></button>
	</header>
	<main>
		<aside class="edit-left-pane" id="left-dock">
			<section class="edit-pane" data-pane="properties">
				<header>Properties <button type="button" aria-label="Close">×</button></header>
				<div id="edit-properties" class="edit-pane-body">No objects selected</div>
			</section>
			<div class="pane-splitter" data-before="properties"></div>
			<section class="edit-pane" data-pane="undo-stack">
				<header>Undo Stack <button type="button" aria-label="Close">×</button></header>
				<div id="edit-undo-stack" class="edit-pane-body">No history</div>
			</section>
			<div class="pane-splitter" data-before="undo-stack"></div>
			<section class="edit-pane" data-pane="filter">
				<header>Selection Filter <button type="button" aria-label="Close">×</button></header>
				<div class="edit-filter-grid">
					<label><input type="checkbox" checked> All items</label><label><input type="checkbox" checked> Rule Areas</label>
					<label><input type="checkbox" checked> Symbols</label><label><input type="checkbox" checked> Pins</label>
					<label><input type="checkbox" checked> Wires</label><label><input type="checkbox" checked> Labels</label>
					<label><input type="checkbox" checked> Graphics</label><label><input type="checkbox" checked> Images</label>
					<label><input type="checkbox" checked> Text</label><label><input type="checkbox" checked> Other items</label>
				</div>
			</section>
		</aside>
		<div class="stage" id="stage">
			<canvas id="canvas2d" class="hidden"></canvas>
			<canvas id="canvas-gl"></canvas>
			<input type="text" id="edit-text-input" class="edit-text-input hidden" placeholder="Text…" autocomplete="off" />
			<textarea id="edit-text-box-input" class="edit-text-input edit-text-box-input hidden" placeholder="Text…" autocomplete="off" rows="4"></textarea>
			<div class="table-modal hidden" id="table-modal">
				<h3>Insert table</h3>
				<label>Rows <input id="table-rows" type="number" min="1" max="30" value="2" /></label>
				<label>Columns <input id="table-columns" type="number" min="1" max="20" value="2" /></label>
				<label>Cell data (tab-separated columns, newline-separated rows)
					<textarea id="table-data" rows="6" placeholder="Header 1&#9;Header 2&#10;Value 1&#9;Value 2"></textarea>
				</label>
				<div class="table-modal-actions"><button type="button" id="table-cancel">Cancel</button><button type="button" id="table-insert">Insert</button></div>
			</div>
			<div class="properties-modal hidden" id="properties-modal">
					<h3 id="properties-modal-title">Properties</h3>
					<div id="properties-modal-body"></div>
					<div class="table-modal-actions"><button type="button" id="properties-modal-close">Close</button></div>
				</div>
			<div class="symbol-chooser hidden" id="symbol-chooser-modal" role="dialog" aria-modal="true" aria-labelledby="symbol-chooser-title">
				<div class="symbol-chooser-header">
					<h3 id="symbol-chooser-title">Choose Symbol</h3>
					<button type="button" class="symbol-chooser-close" id="symbol-chooser-close" aria-label="Close">×</button>
				</div>
				<div class="symbol-chooser-search"><span aria-hidden="true">⌕</span><input id="symbol-chooser-filter" type="search" placeholder="Filter symbols…" autocomplete="off" /></div>
				<div class="symbol-chooser-body">
					<div class="symbol-chooser-list" id="symbol-chooser-list"></div>
					<div class="symbol-chooser-preview">
						<div class="symbol-preview-art" id="symbol-preview-art">
							<canvas id="symbol-preview-canvas" class="hidden"></canvas>
							<span id="symbol-preview-placeholder">Select a symbol to preview</span>
						</div>
						<div class="symbol-preview-details" id="symbol-preview-details"></div>
					</div>
				</div>
				<div class="symbol-chooser-footer">
					<label><input id="symbol-repeat-copies" type="checkbox" /> Place repeated copies</label>
					<label><input id="symbol-all-units" type="checkbox" checked /> Place all units</label>
					<span class="symbol-chooser-spacer"></span>
					<button type="button" id="symbol-chooser-cancel">Cancel</button>
					<button type="button" id="symbol-chooser-ok" class="primary">OK</button>
				</div>
			</div>
				<div class="context-menu hidden" id="context-menu"></div>
		</div>
		<aside class="tool-panel hidden" id="tool-panel">
			<button type="button" class="tool-btn active" data-tool="select" title="Select (S)">
				<svg class="tool-icon" viewBox="0 0 24 24"><path d="M6 3 L6 19 L10 15.5 L13 21 L15.5 19.7 L12.5 14.2 L18 14.2 Z"/></svg>
			</button>
			<button type="button" class="tool-btn" id="btn-highlight-net" title="Highlight Net">
				<svg class="tool-icon" viewBox="0 0 24 24"><path d="M4 16 H20"/><path d="M14 4 V10 M11 7 H17 M12 5 L16 9 M16 5 L12 9"/></svg>
			</button>

			<div class="tool-sep"></div>

			<button type="button" class="tool-btn" data-tool="place-symbol" title="Place Symbol (A)">
				<svg class="tool-icon" viewBox="0 0 24 24"><rect x="7" y="6" width="10" height="12"/><path d="M4 9 H7 M4 15 H7 M17 9 H20 M17 15 H20 M9 6 V4 M15 6 V4 M9 18 V20 M15 18 V20"/></svg>
			</button>
			<button type="button" class="tool-btn cyclable" data-tool="power" id="btn-power-tool" title="Power symbol — right-click to cycle GND/PWR_FLAG/rail">
				<svg class="tool-icon" viewBox="0 0 24 24"><path d="M12 4 V10"/><path d="M7 10 H17 M8.5 13 H15.5 M10.5 16 H13.5"/></svg>
			</button>
			<button type="button" class="tool-btn" data-tool="wire" title="Wire (W)">
				<svg class="tool-icon" viewBox="0 0 24 24"><path d="M4 18 L20 6"/><circle cx="4" cy="18" r="1.6" fill="currentColor" stroke="none"/><circle cx="20" cy="6" r="1.6" fill="currentColor" stroke="none"/></svg>
			</button>
			<button type="button" class="tool-btn" data-tool="bus" title="Bus">
				<svg class="tool-icon" viewBox="0 0 24 24"><path d="M4 19 L18 7"/><path d="M6 21 L20 9"/></svg>
			</button>
			<button type="button" class="tool-btn" data-tool="bus-entry" title="Wire to Bus Entry">
				<svg class="tool-icon" viewBox="0 0 24 24"><path d="M4 12 H12 L16 8"/><path d="M16 4 L20 20"/></svg>
			</button>
			<button type="button" class="tool-btn" data-tool="no-connect" title="No-connect (X)">
				<svg class="tool-icon" viewBox="0 0 24 24"><path d="M6 6 L18 18 M18 6 L6 18"/></svg>
			</button>
			<button type="button" class="tool-btn" data-tool="junction" title="Junction (J)">
				<svg class="tool-icon" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3" fill="currentColor" stroke="none"/></svg>
			</button>
			<button type="button" class="tool-btn cyclable" data-tool="label" id="btn-label-tool" title="Label: Local — right-click to cycle Local/Directive/Global/Hierarchical">
				<svg class="tool-icon" viewBox="0 0 24 24"><path d="M4 8 H15 L19 12 L15 16 H4 Z"/></svg>
			</button>
			<button type="button" class="tool-btn" data-tool="rule-area" title="Rule Area">
				<svg class="tool-icon" viewBox="0 0 24 24"><rect x="5" y="5" width="14" height="14" stroke-dasharray="3 2"/></svg>
			</button>
			<button type="button" class="tool-btn" data-tool="hier-sheet" title="Hierarchical Sheet — not yet implemented" disabled>
				<svg class="tool-icon" viewBox="0 0 24 24"><path d="M5 4 H15 L19 8 V20 H5 Z M15 4 V8 H19"/></svg>
			</button>
			<button type="button" class="tool-btn" data-tool="sheet-pin" title="Place Pins from Sheet — not yet implemented" disabled>
				<svg class="tool-icon" viewBox="0 0 24 24"><rect x="5" y="7" width="10" height="10"/><path d="M15 12 H20 M17 9 L20 12 L17 15"/></svg>
			</button>
			<button type="button" class="tool-btn" data-tool="sync-sheet-pins" title="Sync All Sheet Pins — not yet implemented" disabled>
				<svg class="tool-icon" viewBox="0 0 24 24"><path d="M18 8 A7 7 0 1 0 19 15"/><path d="M14 4 L18 8 L14 9"/></svg>
			</button>

			<div class="tool-sep"></div>

			<button type="button" class="tool-btn" data-tool="text" title="Text">
				<svg class="tool-icon" viewBox="0 0 24 24"><path d="M6 6 H18 M12 6 V18"/></svg>
			</button>
			<button type="button" class="tool-btn" data-tool="text-box" title="Draw Text Box">
				<svg class="tool-icon" viewBox="0 0 24 24"><rect x="4" y="5" width="16" height="14"/><path d="M7 9 H17 M7 12.5 H17 M7 16 H13"/></svg>
			</button>
			<button type="button" class="tool-btn" data-tool="table" title="Draw Table">
				<svg class="tool-icon" viewBox="0 0 24 24"><rect x="4" y="4" width="16" height="16"/><path d="M4 12 H20 M12 4 V20"/></svg>
			</button>
			<button type="button" class="tool-btn cyclable" data-tool="rect" id="btn-shape-tool" title="Shapes — right-click to cycle Rectangle/Circle/Arc/Bezier">
				<svg class="tool-icon" viewBox="0 0 24 24"><rect x="5" y="6" width="14" height="12"/></svg>
			</button>
			<button type="button" class="tool-btn" data-tool="image" title="Place Image (file or clipboard)">
				<svg class="tool-icon" viewBox="0 0 24 24"><rect x="4" y="5" width="16" height="14"/><circle cx="9" cy="10" r="1.6"/><path d="M4 17 L10 12 L14 15 L20 10 V19 H4 Z"/></svg>
			</button>
			<input id="image-input" type="file" accept="image/png,image/jpeg,image/gif" hidden />
			<button type="button" class="tool-btn" data-tool="delete" title="Interactive Delete Tool">
				<svg class="tool-icon" viewBox="0 0 24 24"><path d="M5 7 H19 M9 7 V5 H15 V7 M7 7 L8 20 H16 L17 7"/><path d="M10 10 V17 M14 10 V17"/></svg>
			</button>
		</aside>
	</main>
	<footer class="status-bar">
		<span id="status" class="status-message">Ready</span>
		<span id="coord-status">X: —  Y: —</span>
		<label class="grid-select-label">Grid:
			<select id="grid-select" title="Grid spacing">
				<option value="0.635">0.635 mm (25 mil)</option>
				<option value="1.27" selected>1.27 mm (50 mil)</option>
				<option value="2.54">2.54 mm (100 mil)</option>
				<option value="5.08">5.08 mm (200 mil)</option>
			</select>
		</label>
		<span id="zoom-status">Zoom: —</span>
		<span id="fps-status" title="Render rate — updates while actively interacting (pan/drag/zoom); the app only redraws on demand, so this goes quiet when idle"></span>
	</footer>
	</div>
	<script type="module" src="/src/main.ts"></script>
</body>
</html>
